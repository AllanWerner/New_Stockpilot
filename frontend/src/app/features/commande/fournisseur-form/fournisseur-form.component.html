<h2 mat-dialog-title>Nouveau fournisseur</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="sp-form">
    <mat-form-field appearance="outline" class="sp-form__field">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="nom" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="sp-form__field">
      <mat-label>Email de contact</mat-label>
      <input matInput type="email" formControlName="emailContact" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="sp-form__field">
      <mat-label>Téléphone</mat-label>
      <input matInput formControlName="telephone" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="sp-form__field">
      <mat-label>Délai de livraison (jours)</mat-label>
      <input matInput type="number" formControlName="delaiLivraisonJours" />
    </mat-form-field>

    @if (errorMessage(); as message) {
      <p class="sp-form__error">{{ message }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close [disabled]="loading()">Annuler</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        Créer
      }
    </button>
  </mat-dialog-actions>
</form>
