<h2 mat-dialog-title>Affecter un employé — {{ boutique.nom }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="sp-form">
    <mat-form-field appearance="outline" class="sp-form__field">
      <mat-label>Employé</mat-label>
      <mat-select formControlName="idEmploye">
        @for (employe of employes; track employe.idEmploye) {
          <mat-option [value]="employe.idEmploye">{{ employe.prenom }} {{ employe.nom }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="sp-form__field">
      <mat-label>Poste</mat-label>
      <mat-select formControlName="posteEmploye">
        <mat-option value="VENDEUR">Vendeur</mat-option>
        <mat-option value="RESPONSABLE">Responsable</mat-option>
      </mat-select>
    </mat-form-field>

    @if (errorMessage(); as message) {
      <p class="sp-form__error">{{ message }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close [disabled]="loading()">Annuler</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
      @if (loading()) {
        <mat-spinner diameter="18"></mat-spinner>
      } @else {
        Affecter
      }
    </button>
  </mat-dialog-actions>
</form>
