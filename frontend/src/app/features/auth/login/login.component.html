<div class="sp-login">
  <mat-card class="sp-login__card">
    <div class="sp-login__brand">StockPilot</div>
    <p class="sp-login__subtitle">Gestion de stocks &amp; commandes</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="sp-login__field">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <mat-error>Email invalide.</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="sp-login__field">
        <mat-label>Mot de passe</mat-label>
        <input matInput type="password" formControlName="motDePasse" autocomplete="current-password" />
        @if (form.controls.motDePasse.invalid && form.controls.motDePasse.touched) {
          <mat-error>Mot de passe requis.</mat-error>
        }
      </mat-form-field>

      @if (errorMessage(); as message) {
        <p class="sp-login__error">{{ message }}</p>
      }

      <button mat-flat-button color="primary" type="submit" class="sp-login__submit" [disabled]="loading()">
        @if (loading()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          Se connecter
        }
      </button>
    </form>
  </mat-card>
</div>
