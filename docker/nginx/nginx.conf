server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend REST API — the only component allowed to talk to Postgres and
    # to the external Open Food Facts API (see Jalon 4 architecture doc).
    location /api {
        # Generous timeout: first request against a cold PHP-FPM worker (no
        # opcache warm yet) can be slow, especially over a Windows bind mount
        # in local dev — subsequent requests are fast.
        fastcgi_read_timeout 120s;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_param HTTPS off;
    }

    # Angular SPA — client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
