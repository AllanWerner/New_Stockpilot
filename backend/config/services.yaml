# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            bool $debug: '%kernel.debug%'
            string $offApiBaseUrl: '%env(OFF_API_BASE_URL)%'
            string $emailExpediteur: '%env(MAILER_FROM_EMAIL)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Repository interfaces are injected into services (never the concrete Doctrine
    # repositories directly), so services can be unit-tested against mocks of these
    # interfaces without booting Doctrine — see Jalon 4 architecture doc.
    App\Repository\EmployeRepositoryInterface: '@App\Repository\EmployeRepository'
    App\Repository\BoutiqueRepositoryInterface: '@App\Repository\BoutiqueRepository'
    App\Repository\AffectationRepositoryInterface: '@App\Repository\AffectationRepository'
    App\Repository\FournisseurRepositoryInterface: '@App\Repository\FournisseurRepository'
    App\Repository\CategorieRepositoryInterface: '@App\Repository\CategorieRepository'
    App\Repository\ProduitRepositoryInterface: '@App\Repository\ProduitRepository'
    App\Repository\StockRepositoryInterface: '@App\Repository\StockRepository'
    App\Repository\CommandeRepositoryInterface: '@App\Repository\CommandeRepository'
    App\Repository\MouvementStockRepositoryInterface: '@App\Repository\MouvementStockRepository'
    App\Repository\NotificationRepositoryInterface: '@App\Repository\NotificationRepository'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
