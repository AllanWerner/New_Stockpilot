security:
    password_hashers:
        App\Entity\Employe: 'auto'
    providers:
        employes:
            entity:
                class: App\Entity\Employe
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        # Plain controller (AuthController::login) issues the JWT itself via
        # AuthService — no Symfony authenticator on this firewall, so it can't
        # collide with the "api" firewall's JWT authenticator below.
        login:
            pattern: ^/api/auth/login
            stateless: true
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: employes
            user_checker: App\Security\EmployeUserChecker
            jwt: ~

    access_control:
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            App\Entity\Employe:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
