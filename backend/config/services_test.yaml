services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Tests\Fake\:
        resource: '../tests/Fake/'

    # Swaps the real Open Food Facts HTTP client for a MockHttpClient in the test
    # environment, so functional tests never hit the real network.
    Symfony\Contracts\HttpClient\HttpClientInterface:
        class: Symfony\Component\HttpClient\MockHttpClient
        arguments: ['@App\Tests\Fake\OffMockResponseFactory']
